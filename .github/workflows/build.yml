name: Build check

# Це САНІТАРНА перевірка: підтверджує, що шаблон (kpithesis.cls +
# приклад вмісту) досі компілюється XeLaTeX'ом без помилок, кожного
# разу, коли хтось змінює клас чи чернетку. PDF, який тут збирається,
# НЕ призначений для студентів -- це внутрішня перевірка розробників
# шаблону. Те, що студент завантажує собі, готує окремий workflow
# release.yml (запускається лише коли ставлять тег).

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with XeLaTeX + biber
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error
